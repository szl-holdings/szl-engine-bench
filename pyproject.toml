[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-engine-bench"
version = "0.1.0"
description = "Honest inference-engine benchmark harness: TTFT/throughput percentiles, fairness gates, hash-chained receipts. Fail closed."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["engine_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
